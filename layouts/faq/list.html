{{ define "main" }}

<section class="srp-page-hero">
  <div class="srp-section-inner">
    <p class="srp-section-label">Helpful Answers</p>
    <h1>Frequently Asked Questions</h1>
    <p>
      Learn more about roof rejuvenation, how the process works,
      and whether your asphalt shingle roof may be a good candidate.
    </p>
  </div>
</section>

<section class="srp-faq-section">
  <div class="srp-section-inner srp-faq-wrap">

    {{ range .Pages }}
      <div class="srp-faq-item">
        <button class="srp-faq-question" type="button">
          <span>{{ .Title }}</span>
          <span class="srp-faq-icon">+</span>
        </button>

        <div class="srp-faq-answer">
          <div class="srp-faq-answer-inner">
            {{ .Content }}
          </div>
        </div>
      </div>
    {{ end }}

  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const items = document.querySelectorAll(".srp-faq-item");

  items.forEach((item) => {
    const button = item.querySelector(".srp-faq-question");

    button.addEventListener("click", () => {
      const isOpen = item.classList.contains("open");

      items.forEach((otherItem) => {
        otherItem.classList.remove("open");
      });

      if (!isOpen) {
        item.classList.add("open");
      }
    });
  });
});
</script>

{{ end }}
